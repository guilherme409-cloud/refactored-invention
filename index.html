<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; width: 100vw; height: 100vh; justify-content: center; align-items: center; margin: 0; box-sizing: border-box;">
    <div style="height: 500px; width: 500px; background-color: rgb(130, 181, 224); border: solid 2px #333; overflow-y: auto;">
        <div style="padding: 10px; width: fit-content; margin: 25px 0 10px 25px; border-radius: 0 20px 20px 20px; background-color: bisque;">
            <p>Bom dia, Sasa!</p>
        </div>
        <div style="padding: 10px; width: fit-content; margin: 10px 25px 25px 0; border-radius: 20px 0 20px 20px; background-color: bisque; float: right;">
            <p>Boa Noite Guigo! Como foi seu dia?</p>
        </div>
    </div>
</body>
</html>
